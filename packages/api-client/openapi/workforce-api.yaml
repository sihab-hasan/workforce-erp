openapi: 3.1.0
info:
  title: WORKFORCE API
  version: 1.1.0
  description: "Canonical Laravel API contract for Workforce ERP.


    User-facing business endpoints authenticate with Laravel Sanctum bearer

    tokens. `X-API-TOKEN` is reserved for explicitly scoped trusted

    server-to-server endpoints and is not a replacement for user authorization.

    "
servers:
  - url: http://localhost:8000
    description: Local Laravel API
tags:
  - name: System
  - name: Internal
  - name: Authentication
  - name: Users
  - name: Employees
  - name: Timesheets
paths:
  /api/health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Check API health
      security: []
      responses:
        "200":
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/internal/ping:
    get:
      tags:
        - Internal
      operationId: internalPing
      summary: Check trusted service-to-service connectivity
      description: Requires the configured shared API token header. This route does not authenticate Portal users.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Shared API token accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalPingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Internal API token authentication is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      operationId: login
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/password/forgot:
    post:
      tags:
        - Authentication
      operationId: forgotPassword
      summary: Request a password reset link
      description:
        Returns the same accepted response for unknown or ineligible accounts. Delivery uses the configured Laravel
        mail transport.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: If the account is eligible and email delivery is available, a password reset link will arrive shortly.
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/password/reset:
    post:
      tags:
        - Authentication
      operationId: resetPassword
      summary: Reset a password with the Laravel password-broker token
      description: On success, changes the password and revokes all existing Sanctum tokens for the account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/otp/request:
    post:
      tags:
        - Authentication
      operationId: requestOtp
      summary: Request a one-time sign-in code
      description: Returns the same accepted response for unknown or blocked accounts to avoid disclosing account existence/state.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: If the account is eligible and email delivery is available, a one-time code will arrive shortly.
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/otp/verify:
    post:
      tags:
        - Authentication
      operationId: verifyOtp
      summary: Verify a one-time code and issue a Sanctum token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^\\d{6}$
                  minLength: 6
                  maxLength: 6
                client:
                  type: string
                  enum:
                    - portal
                    - admin
                  default: portal
      responses:
        "200":
          description: One-time code verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/sso/redirect/{provider}:
    get:
      tags:
        - Authentication
      operationId: getSsoRedirect
      summary: Create an SSO authorization redirect URL, state, and server-bound PKCE transaction
      security: []
      parameters:
        - $ref: "#/components/parameters/SsoProvider"
      responses:
        "200":
          description: Redirect information generated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - redirect_url
                  - state
                properties:
                  success:
                    type: boolean
                    const: true
                  redirect_url:
                    type: string
                    format: uri
                  state:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: SSO provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/sso/callback/{provider}:
    post:
      tags:
        - Authentication
      operationId: completeSso
      summary: Complete an SSO authorization-code + PKCE flow
      description: The API consumes the one-time state and sends its cached PKCE verifier to the selected provider token endpoint.
      security: []
      parameters:
        - $ref: "#/components/parameters/SsoProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - code
                - state
              properties:
                code:
                  type: string
                  maxLength: 4096
                state:
                  type: string
                  minLength: 48
                  maxLength: 48
      responses:
        "200":
          description: SSO authentication completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "419":
          description: Invalid or expired SSO state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: SSO provider is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: SSO provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      operationId: getCurrentUser
      summary: Return the authenticated user context
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - user
                properties:
                  success:
                    type: boolean
                    const: true
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sessions:
    get:
      tags:
        - Authentication
      operationId: listAuthSessions
      summary: List active browser sessions or API-token sessions for the authenticated client
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active token sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sessions/{tokenId}:
    delete:
      tags:
        - Authentication
      operationId: revokeAuthSession
      summary: Revoke one of the authenticated user’s sessions
      security:
        - BearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/password/change:
    post:
      tags:
        - Authentication
      operationId: changePassword
      summary: Change the authenticated user’s password
      description: Requires the current password and revokes all Sanctum tokens after a successful change.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      operationId: logout
      summary: Log out the current browser session or revoke the current API token
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current token revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Logged out successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout-all:
    post:
      tags:
        - Authentication
      operationId: logoutAll
      summary: Revoke every Sanctum API token for the authenticated user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users:
    get:
      tags:
        - Users
      operationId: listUsers
      summary: List users visible to the current owner/admin
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: organization_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: role
          in: query
          schema:
            oneOf:
              - $ref: "#/components/schemas/UserRole"
              - type: string
                const: all
        - name: status
          in: query
          schema:
            oneOf:
              - $ref: "#/components/schemas/UserStatus"
              - type: string
                const: all
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags:
        - Users
      operationId: inviteUser
      summary: Invite a user into an organization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: User invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/users/options/organizations:
    get:
      tags:
        - Users
      operationId: listUserOrganizationOptions
      summary: List organizations the current user can administer
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Organization options
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/OrganizationOption"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/options/roles:
    get:
      tags:
        - Users
      operationId: listUserRoleOptions
      summary: List assignable coarse-grained user roles
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Role options
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RoleOption"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/options/employees:
    get:
      tags:
        - Users
      operationId: listUserEmployeeOptions
      summary: List employees available for user linking
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Employee options
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/EmployeeOption"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/{user}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags:
        - Users
      operationId: getUser
      summary: Get a user in a manageable shared organization
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Users
      operationId: updateUser
      summary: Update a user membership/profile link
      description: Partial-update semantics are supported even though the route uses PUT for frontend compatibility.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/users/{user}/activate:
    patch:
      tags:
        - Users
      operationId: activateUser
      summary: Activate a user membership
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/{user}/deactivate:
    patch:
      tags:
        - Users
      operationId: deactivateUser
      summary: Deactivate a user membership and revoke the user's tokens
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/{user}/suspend:
    patch:
      tags:
        - Users
      operationId: suspendUser
      summary: Suspend a user membership and revoke the user's tokens
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/{user}/resend-invitation:
    post:
      tags:
        - Users
      operationId: resendUserInvitation
      summary: Re-send a user's invitation email
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Invitation delivery attempted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - delivered
                          - sent_at
                        properties:
                          delivered:
                            type: boolean
                          sent_at:
                            anyOf:
                              - type: string
                                format: date-time
                              - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/employees:
    get:
      tags:
        - Employees
      operationId: listEmployees
      summary: List employees in the authenticated user's active organizations
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: department
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated employees
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Employee"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/employees/options:
    get:
      tags:
        - Employees
      operationId: getEmployeeDirectoryOptions
      summary: Get employee-directory filter options
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Department and location values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/EmployeeDirectoryOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/employees/summary:
    get:
      tags:
        - Employees
      operationId: getEmployeeDirectorySummary
      summary: Get employee-directory summary counts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Employee summary counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/EmployeeDirectorySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/timesheets:
    get:
      tags:
        - Timesheets
      operationId: listTimesheets
      summary: List timesheets allowed by organization role / employee ownership
      security:
        - BearerAuth: []
      parameters:
        - name: employee_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            oneOf:
              - $ref: "#/components/schemas/TimesheetStatus"
              - type: string
                const: all
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated timesheets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Timesheet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags:
        - Timesheets
      operationId: createTimesheet
      summary: Create a manual timesheet record
      description: Requires a timesheet-manager role in the employee's organization.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreTimesheetRequest"
      responses:
        "201":
          description: Timesheet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/timesheets/today:
    get:
      tags:
        - Timesheets
      operationId: getTodayTimesheetStatus
      summary: Get current-day timesheet state for an allowed employee
      security:
        - BearerAuth: []
      parameters:
        - name: employee_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Current-day timesheet state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/TodayTimesheetStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/timesheets/clock-in:
    post:
      tags:
        - Timesheets
      operationId: clockIn
      summary: Clock an allowed employee in
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                employee_id:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Clock-in created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/timesheets/clock-out:
    post:
      tags:
        - Timesheets
      operationId: clockOut
      summary: Clock an allowed employee out of their active record
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                employee_id:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Clock-out completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/timesheets/{timesheet}:
    parameters:
      - $ref: "#/components/parameters/TimesheetId"
    get:
      tags:
        - Timesheets
      operationId: getTimesheet
      summary: Get an accessible timesheet
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Timesheet details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Timesheets
      operationId: updateTimesheet
      summary: Update a timesheet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTimesheetRequest"
      responses:
        "200":
          description: Timesheet updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Timesheets
      operationId: deleteTimesheet
      summary: Delete a timesheet
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Timesheet deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Timesheet deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Laravel Sanctum personal access token
      description: Personal access token for explicitly non-browser API clients. Browser sign-in uses Sanctum session cookies and does not return a bearer token.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-TOKEN
      description: Environment-configured shared token used only by explicitly scoped trusted service endpoints.
  parameters:
    SsoProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum:
          - google
          - microsoft
    UserId:
      name: user
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TimesheetId:
      name: timesheet
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 255
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
  responses:
    BadRequest:
      description: Request could not be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not authorized for the operation/resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Route or resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current application state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    TooManyRequests:
      description: Rate limit or workflow attempt limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          example: workforce-erp-api
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - errors
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    InternalPingResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: false
          required:
            - service
            - authenticated_via
          properties:
            service:
              type: string
              example: workforce-erp-api
            authenticated_via:
              type: string
              example: X-API-TOKEN
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        client:
          type: string
          enum:
            - portal
            - admin
          default: portal
    AuthSuccessResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - user
      properties:
        success:
          type: boolean
          const: true
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthUser:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          anyOf:
            - $ref: "#/components/schemas/UserRole"
            - type: "null"
        organization_id:
          anyOf:
            - type: string
            - type: "null"
        organization_name:
          anyOf:
            - type: string
            - type: "null"
        sso_provider:
          anyOf:
            - type: string
              enum:
                - google
                - microsoft
            - type: "null"
    UserRole:
      type: string
      enum:
        - owner
        - admin
        - manager
        - staff
        - readonly
    UserStatus:
      type: string
      enum:
        - active
        - inactive
        - invited
        - suspended
    OrganizationOption:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
    RoleOption:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          $ref: "#/components/schemas/UserRole"
    EmployeeOption:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
        name:
          type: string
        department:
          type:
            - string
            - "null"
        designation:
          type:
            - string
            - "null"
        email:
          type: string
          format: email
    UserEmployeeLink:
      type: object
      additionalProperties: false
      required:
        - employee_id
        - employee_name
        - department
        - designation
      properties:
        employee_id:
          type: string
        employee_name:
          type: string
        department:
          type:
            - string
            - "null"
        designation:
          type:
            - string
            - "null"
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - role
        - status
        - organization
        - employee
        - organization_id
        - organization_name
        - employee_id
        - employee_name
        - created_at
        - updated_at
        - last_login_at
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        organization:
          anyOf:
            - $ref: "#/components/schemas/OrganizationOption"
            - type: "null"
        employee:
          anyOf:
            - $ref: "#/components/schemas/UserEmployeeLink"
            - type: "null"
        organization_id:
          type:
            - string
            - "null"
        organization_name:
          type: string
        employee_id:
          type:
            - string
            - "null"
        employee_name:
          type:
            - string
            - "null"
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
        last_login_at:
          type:
            - string
            - "null"
          format: date-time
        invitation_delivered:
          anyOf:
            - type: boolean
            - type: "null"
          description: Present on invite responses; false means the account was created but mail delivery failed.
    InviteUserRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - role
        - organization_id
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        role:
          $ref: "#/components/schemas/UserRole"
        organization_id:
          type: integer
          minimum: 1
        employee_id:
          type:
            - integer
            - "null"
          minimum: 1
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 255
        role:
          $ref: "#/components/schemas/UserRole"
        organization_id:
          type: integer
          minimum: 1
        employee_id:
          type:
            - integer
            - "null"
          minimum: 1
    UserEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/User"
    EmployeeStatus:
      type: string
      enum:
        - active
        - on-leave
        - probation
        - inactive
    EmploymentType:
      type: string
      enum:
        - full-time
        - part-time
        - contractor
        - intern
    Employee:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - initials
        - title
        - department
        - employmentType
        - status
        - manager
        - location
        - hireDate
        - email
      properties:
        id:
          type: string
        name:
          type: string
        initials:
          type: string
        title:
          type: string
        department:
          type: string
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        manager:
          type: string
        location:
          type: string
        hireDate:
          type:
            - string
            - "null"
          format: date
        email:
          type: string
          format: email
    EmployeeDirectoryOptions:
      type: object
      additionalProperties: false
      required:
        - departments
        - locations
      properties:
        departments:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            type: string
    EmployeeDirectorySummary:
      type: object
      additionalProperties: false
      required:
        - total
        - active
        - on_leave
        - probation
        - new_this_month
      properties:
        total:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        on_leave:
          type: integer
          minimum: 0
        probation:
          type: integer
          minimum: 0
        new_this_month:
          type: integer
          minimum: 0
    TimesheetStatus:
      type: string
      enum:
        - present
        - absent
        - on-leave
        - half-day
        - pending
        - approved
        - rejected
    TimesheetEmployee:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    Timesheet:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - employee_id
        - employee
        - date
        - clock_in
        - clock_out
        - total_hours
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        organization_id:
          type: string
        employee_id:
          type: string
        employee:
          anyOf:
            - $ref: "#/components/schemas/TimesheetEmployee"
            - type: "null"
        date:
          type:
            - string
            - "null"
          format: date
        clock_in:
          type:
            - string
            - "null"
          format: date-time
        clock_out:
          type:
            - string
            - "null"
          format: date-time
        total_hours:
          type: number
          format: float
          minimum: 0
        status:
          $ref: "#/components/schemas/TimesheetStatus"
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    StoreTimesheetRequest:
      type: object
      additionalProperties: false
      required:
        - employee_id
        - date
      properties:
        employee_id:
          type: integer
          minimum: 1
        date:
          type: string
          format: date
        clock_in:
          type:
            - string
            - "null"
          format: date-time
        clock_out:
          type:
            - string
            - "null"
          format: date-time
        total_hours:
          type:
            - number
            - "null"
          minimum: 0
        status:
          anyOf:
            - $ref: "#/components/schemas/TimesheetStatus"
            - type: "null"
    UpdateTimesheetRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        employee_id:
          type: integer
          minimum: 1
        date:
          type: string
          format: date
        clock_in:
          type:
            - string
            - "null"
          format: date-time
        clock_out:
          type:
            - string
            - "null"
          format: date-time
        total_hours:
          type:
            - number
            - "null"
          minimum: 0
        status:
          anyOf:
            - $ref: "#/components/schemas/TimesheetStatus"
            - type: "null"
    TimesheetEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/Timesheet"
    TodayTimesheetStatus:
      type: object
      additionalProperties: false
      required:
        - is_clocked_in
        - active_timesheet
        - today
        - total_today_hours
      properties:
        is_clocked_in:
          type: boolean
        active_timesheet:
          anyOf:
            - $ref: "#/components/schemas/Timesheet"
            - type: "null"
        today:
          type: string
          format: date
        total_today_hours:
          type: number
          format: float
          minimum: 0
    PaginationMeta:
      type: object
      additionalProperties: false
      required:
        - current_page
        - from
        - last_page
        - path
        - per_page
        - to
        - total
      properties:
        current_page:
          type: integer
          minimum: 1
        from:
          type:
            - integer
            - "null"
        last_page:
          type: integer
          minimum: 1
        path:
          type: string
          format: uri
        per_page:
          type: integer
          minimum: 1
        to:
          type:
            - integer
            - "null"
        total:
          type: integer
          minimum: 0
    PaginationLinks:
      type: object
      additionalProperties: false
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          type:
            - string
            - "null"
          format: uri
        last:
          type:
            - string
            - "null"
          format: uri
        prev:
          type:
            - string
            - "null"
          format: uri
        next:
          type:
            - string
            - "null"
          format: uri
    PaginatedEnvelope:
      type: object
      required:
        - success
        - data
        - meta
        - links
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: array
          items: {}
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - email
        - password
        - password_confirmation
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password: &id001
          type: string
          minLength: 10
          maxLength: 4096
          description: Must satisfy backend mixed-case, number, and symbol requirements.
        password_confirmation:
          type: string
          minLength: 10
          maxLength: 4096
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - current_password
        - password
        - password_confirmation
      properties:
        current_password:
          type: string
          maxLength: 4096
        password: *id001
        password_confirmation:
          type: string
          minLength: 10
          maxLength: 4096
    AuthSessionRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - created_at
        - last_used_at
        - expires_at
        - current
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        last_used_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        current:
          type: boolean
    AuthSessionsResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuthSessionRecord"
