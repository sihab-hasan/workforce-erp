name: workforce-erp

x-frontend-build-args: &frontend-build-args
  VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
  VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api}
  VITE_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
  VITE_ERP_URL: ${PUBLIC_ERP_URL:-http://localhost:5174}
  VITE_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:5175}

x-frontend-runtime: &frontend-runtime
  restart: unless-stopped
  init: true
  networks:
    - workforce

services:
  web:
    <<: *frontend-runtime
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args: *frontend-build-args
    ports:
      - "${WEB_PORT:-5173}:80"

  erp:
    <<: *frontend-runtime
    build:
      context: ..
      dockerfile: infra/docker/erp.Dockerfile
      args: *frontend-build-args
    ports:
      - "${ERP_PORT:-5174}:80"

  admin:
    <<: *frontend-runtime
    build:
      context: ..
      dockerfile: infra/docker/admin.Dockerfile
      args: *frontend-build-args
    ports:
      - "${ADMIN_PORT:-5175}:80"

  worker:
    profiles: ["worker"]
    init: true
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      API_URL: ${WORKER_API_URL:-http://host.docker.internal:8000/api}
      API_TOKEN: ${API_TOKEN:-}
      API_TOKEN_HEADER: ${API_TOKEN_HEADER:-X-API-TOKEN}
      WORKER_ENABLED: ${WORKER_ENABLED:-false}
      WORKER_JOBS_PATH: ${WORKER_JOBS_PATH:-}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-15000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - workforce

networks:
  workforce:
    name: workforce-erp-network
    driver: bridge
