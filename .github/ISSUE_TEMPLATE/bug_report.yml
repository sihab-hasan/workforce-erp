name: Bug report
description: Report a reproducible problem or regression
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, tokens, personal data, or security vulnerabilities in this public form.

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Select the application or repository area where the problem occurs.
      options:
        - Public website (apps/web)
        - Customer portal (apps/portal)
        - Administration app (apps/admin)
        - Laravel API (apps/api)
        - Shared package
        - CI or GitHub Actions
        - Documentation
        - Infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Clearly describe what is broken and who it affects.
      placeholder: A concise description of the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      placeholder: Describe what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      placeholder: Describe what happened instead, including visible error messages.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the browser, operating system, app environment, or commit when relevant.
      placeholder: Chrome 126 on Windows 11, local development, commit abc123

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or additional context
      description: Remove secrets and personal or sensitive data before attaching evidence.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This report does not contain secrets, personal data, or a security vulnerability.
          required: true
