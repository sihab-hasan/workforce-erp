name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - Public web app (apps/web)
        - ERP app (apps/erp)
        - Admin app (apps/admin)
        - Laravel API (apps/api)
        - Worker service (services/worker)
        - Shared package (packages/*)
        - Tooling or scripts
        - CI or GitHub Actions
        - Documentation
        - Infrastructure
        - Cross-application
        - Other
    validations:
      required: true

  - type: textarea
    id: requested-feature
    attributes:
      label: Feature request
      description: Describe what should be built, why it is needed, and the expected behavior.
      placeholder: Build ... so that users can ...
    validations:
      required: true

  - type: input
    id: work-location
    attributes:
      label: Primary work location
      description: Specify the main app, package, directory, or file when known.
      placeholder: apps/erp/src/...

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - ...
        - ...

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate request.
          required: true
