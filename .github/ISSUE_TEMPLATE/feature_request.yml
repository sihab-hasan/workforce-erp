name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Select where the feature belongs.
      options:
        - Public website (apps/web)
        - Customer portal (apps/portal)
        - Administration app (apps/admin)
        - Laravel API (apps/api)
        - Shared package
        - CI or GitHub Actions
        - Documentation
        - Infrastructure
        - Cross-application
        - Other
    validations:
      required: true

  - type: textarea
    id: requested-feature
    attributes:
      label: Feature request
      description: Describe what should be built, why it is needed, and the expected behavior.
      placeholder: Build ... so that users can ...
    validations:
      required: true

  - type: input
    id: work-location
    attributes:
      label: Contributor work location
      description: Provide the primary app, directory, or file where the work belongs.
      placeholder: apps/web/src/modules/home/components/HeroSection.tsx
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the testable requirements for completion.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate request.
          required: true
