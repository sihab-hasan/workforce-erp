name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first so the proposal can be evaluated against user needs, architecture, and delivery impact.

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Select the primary application or repository area for this proposal.
      options:
        - Public website (apps/web)
        - Customer portal (apps/portal)
        - Administration app (apps/admin)
        - Laravel API (apps/api)
        - Shared package
        - CI or GitHub Actions
        - Documentation
        - Infrastructure
        - Cross-application
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Explain the user or business need without prescribing the implementation.
      placeholder: Who has this problem, what are they trying to do, and why does it matter?
    validations:
      required: true

  - type: textarea
    id: proposed-outcome
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior and acceptance criteria.
      placeholder: |
        Users should be able to ...

        Acceptance criteria:
        - ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.

  - type: textarea
    id: impact
    attributes:
      label: Additional impact or context
      description: Note permissions, API, data, migration, privacy, rollout, or compatibility considerations when known.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate request.
          required: true
        - label: I described the need and expected outcome, not only an implementation preference.
          required: true
