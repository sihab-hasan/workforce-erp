name: Feature request
description: Propose a new capability or improvement
labels:
  - enhancement
body:
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Select where the feature belongs.
      options:
        - Public website (apps/web)
        - ERP portal (apps/portal)
        - Administration app (apps/admin)
        - Laravel API (apps/api)
        - Shared package (packages/*)
        - CI or GitHub Actions
        - Documentation
        - Infrastructure
        - Cross-application
        - Other
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Feature request

  - type: textarea
    id: requested-feature
    attributes:
      label: Description
      description: Describe what should be built, why it is needed, and the expected behavior.
      placeholder: Build ... so that users can ...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Contributor work location

  - type: input
    id: work-location
    attributes:
      label: Primary location
      description: Specify the primary app, package, directory, or file where the contributor must work.
      placeholder: apps/web/src/modules/home/components/HeroSection.tsx
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Related files

  - type: textarea
    id: related-files
    attributes:
      label: Files or directories
      description: List relevant files or directories if known. This field may be left empty.
      placeholder: |
        apps/web/src/modules/home/components/HeroSection.tsx
        apps/web/src/modules/home/pages/HomePage.tsx

  - type: markdown
    attributes:
      value: |
        ## Acceptance criteria

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Requirements
      description: List the testable requirements if known. This field may be left empty.
      placeholder: |
        - ...
        - ...

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate request.
          required: true
