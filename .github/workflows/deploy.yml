name: Deploy Scaffold

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      deploy_web:
        description: Deploy the public web app
        required: false
        type: boolean
        default: true
      deploy_client:
        description: Deploy the client app
        required: false
        type: boolean
        default: true
      deploy_admin:
        description: Deploy the admin app
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php-composer

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  deployment-guide:
    name: Deployment handoff
    runs-on: ubuntu-latest
    needs: verify
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Summarize selected targets
        shell: bash
        run: |
          {
            echo '## Deployment scaffold'
            echo ''
            echo 'This workflow intentionally verifies the repo and then stops at a manual handoff step.'
            echo 'No provider-specific deployment is wired yet.'
            echo ''
            echo '## Selected targets'
            echo ''
            echo "Environment: ${{ github.event.inputs.environment }}"
            echo "Web: ${{ github.event.inputs.deploy_web }}"
            echo "Client: ${{ github.event.inputs.deploy_client }}"
            echo "Admin: ${{ github.event.inputs.deploy_admin }}"
            echo ''
            echo '## Next step'
            echo ''
            echo 'Add real deployment steps only after hosting targets, secrets, and ownership are finalized.'
          } >> "$GITHUB_STEP_SUMMARY"
