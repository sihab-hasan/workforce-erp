name: Production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  branch-policy:
    name: Verify production branch
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Production deployment is allowed only from the main branch."
            exit 1
          fi

  node-validation:
    name: Validate Node workspace
    needs: branch-policy
    uses: ./.github/workflows/frontend.yml

  api-validation:
    name: Validate Laravel API
    needs: branch-policy
    uses: ./.github/workflows/api.yml

  deployment-guide:
    name: Production deployment handoff
    runs-on: ubuntu-latest
    needs:
      - node-validation
      - api-validation
    environment: production

    steps:
      - name: Summarize deployment status
        shell: bash
        run: |
          {
            echo '## Production deployment'
            echo ''
            echo 'Source branch: `main`'
            echo 'Environment: `production`'
            echo ''
            echo 'Repository validation passed.'
            echo ''
            echo '> Provider-specific deployment commands are not configured yet.'
            echo '> Add the hosting/deployment step here once the production target and credentials are finalized.'
          } >> "$GITHUB_STEP_SUMMARY"
