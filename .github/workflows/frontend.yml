name: Node workspace validation

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: Nx affected validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Validate repository configuration
        run: pnpm validate

      - name: Check import boundaries
        run: pnpm check:imports

      - name: Set Nx affected SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Validate affected Node projects
        run: pnpm nx affected -t typecheck lint build --exclude=@workforce-erp/api
