name: API validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Format and test Laravel API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php-composer

      - name: Check formatting
        run: composer --working-dir=apps/api exec pint -- --test

      - name: Run tests
        run: composer --working-dir=apps/api test
