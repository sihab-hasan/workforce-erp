name: Laravel API validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test Laravel API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php-composer
        with:
          install: "false"

      - name: Validate Composer metadata
        run: composer --working-dir=apps/api validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer --working-dir=apps/api install --no-interaction --prefer-dist --no-progress

      - name: Run API test suite
        run: composer --working-dir=apps/api test
