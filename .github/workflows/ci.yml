name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-workspace:
    name: Node workspace
    uses: ./.github/workflows/frontend.yml

  api:
    name: Laravel API
    uses: ./.github/workflows/api.yml
