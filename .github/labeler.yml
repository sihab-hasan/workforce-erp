frontend:
  - changed-files:
      - any-glob-to-any-file: "apps/web/**"
      - any-glob-to-any-file: "apps/portal/**"
      - any-glob-to-any-file: "apps/admin/**"
      - any-glob-to-any-file: "packages/ui/**"

admin:
  - changed-files:
      - any-glob-to-any-file: "apps/admin/**"

portal:
  - changed-files:
      - any-glob-to-any-file: "apps/portal/**"

web:
  - changed-files:
      - any-glob-to-any-file: "apps/web/**"

packages:
  - changed-files:
      - any-glob-to-any-file: "packages/**"

api-client:
  - changed-files:
      - any-glob-to-any-file: "packages/api-client/**"

ui:
  - changed-files:
      - any-glob-to-any-file: "packages/ui/**"

types:
  - changed-files:
      - any-glob-to-any-file: "packages/types/**"

utils:
  - changed-files:
      - any-glob-to-any-file: "packages/utils/**"

config:
  - changed-files:
      - any-glob-to-any-file: "packages/config/**"

constants:
  - changed-files:
      - any-glob-to-any-file: "packages/constants/**"

docs:
  - changed-files:
      - any-glob-to-any-file: "docs/**"
      - any-glob-to-any-file: "**/*.md"

infra:
  - changed-files:
      - any-glob-to-any-file: "infra/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file: "package.json"
