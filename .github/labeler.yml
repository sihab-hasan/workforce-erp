web:
  - changed-files:
      - any-glob-to-any-file: "apps/web/**"

erp:
  - changed-files:
      - any-glob-to-any-file: "apps/erp/**"

admin:
  - changed-files:
      - any-glob-to-any-file: "apps/admin/**"

api:
  - changed-files:
      - any-glob-to-any-file: "apps/api/**"

worker:
  - changed-files:
      - any-glob-to-any-file: "services/worker/**"

packages:
  - changed-files:
      - any-glob-to-any-file: "packages/**"

tooling:
  - changed-files:
      - any-glob-to-any-file: "tooling/**"
      - any-glob-to-any-file: "scripts/**"

infra:
  - changed-files:
      - any-glob-to-any-file: "infra/**"
      - any-glob-to-any-file: ".dockerignore"

docs:
  - changed-files:
      - any-glob-to-any-file: "docs/**"
      - any-glob-to-any-file: "**/*.md"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"
          - "apps/*/package.json"
          - "services/*/package.json"
          - "packages/*/package.json"
          - "apps/api/composer.json"
          - "apps/api/composer.lock"
