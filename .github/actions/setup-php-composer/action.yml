name: Setup PHP and Composer
description: Configure PHP and install the Laravel API Composer dependencies.

inputs:
  php-version:
    description: PHP version to use
    required: false
    default: "8.2"
  install:
    description: Whether to run Composer install
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none

    - name: Install API dependencies
      if: inputs.install == 'true'
      shell: bash
      run: composer --working-dir=apps/api install --no-interaction --no-progress --prefer-dist
