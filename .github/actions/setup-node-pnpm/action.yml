name: Setup workspace

description: Configure PHP, Composer, pnpm, and Node.js, then install workspace dependencies.

inputs:
  php-version:
    description: PHP version to use
    required: false
    default: "8.2"
  node-version:
    description: Node.js version to use
    required: false
    default: "20"
  install:
    description: Whether to run pnpm install
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none

    - name: Install API dependencies
      shell: bash
      run: composer --working-dir=apps/api install --no-interaction --no-progress --prefer-dist

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.33.4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
